---
version: 2
updates:
  - package-ecosystem: "github-actions"
    assignees:
      - "kernelsam"
    cooldown:
      default-days: 21
      exclude:
        - "senzing-factory/*"
    directory: "/"
    groups:
      senzing-factory:
        patterns:
          - "senzing-factory/*"
    schedule:
      interval: "daily"
  - package-ecosystem: "maven"
    assignees:
      - "barrycaceres"
    cooldown:
      default-days: 21
    directory: "/tooling/jdt-formatter"
    schedule:
      interval: "daily"
  - package-ecosystem: "pip"
    assignees:
      - "barrycaceres"
    cooldown:
      default-days: 21
    directory: "/tooling/scripts"
    schedule:
      interval: "daily"
  - package-ecosystem: "pip"
    assignees:
      - "barrycaceres"
    cooldown:
      default-days: 21
    directory: "/tooling/scripts/tests"
    schedule:
      interval: "daily"
