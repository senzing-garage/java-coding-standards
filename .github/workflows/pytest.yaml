name: pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  pytest:
    name: "Pytest: Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The format scripts use only the standard library (re, pathlib,
        # sys, argparse) and PEP 604 union syntax (`str | None`) introduced
        # in 3.10, so 3.10+ is the supported floor. The new AST formatter
        # in `format_java.py` adds runtime deps (tree-sitter,
        # tree-sitter-java) installed by `tooling/scripts/requirements.txt`.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up JDK 17
        # JDK is required by the format_file.py orchestrator's JDT
        # pass; the orchestrator pipeline tests exercise it directly.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build jdt-formatter.jar from source
        # Rebuild from source on every CI run rather than trust the
        # committed JAR; keeps source and JAR locked together so a
        # bad commit can't go unnoticed.
        run: |
          cd tooling/jdt-formatter
          mvn -B -q package
          cp target/jdt-formatter.jar jdt-formatter.jar

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r tooling/scripts/tests/requirements.txt

      - name: Run pytest
        run: pytest tooling/scripts/tests/ --verbose
