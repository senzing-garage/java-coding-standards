name: release

# Triggered when a maintainer pushes a `v*` tag (e.g. `v0.2.0`).
# Builds the JDT formatter JAR from source, computes a SHA-256
# digest, and publishes both as assets on a new GitHub Release.
# Consumer projects' format_file.py downloads the JAR + .sha256
# from the matching release URL and verifies integrity before
# invocation, so the JAR is never committed to git.

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the GitHub Release.
    timeout-minutes: 10
    steps:
      - name: Determine release tag
        id: tag
        run: |
          echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Checkout tag
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ steps.tag.outputs.value }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build fat JAR
        run: |
          cd tooling/jdt-formatter
          mvn -B -q package
          ls -la target/jdt-formatter.jar

      - name: Compute SHA-256
        id: sha
        run: |
          cd tooling/jdt-formatter/target
          shasum -a 256 jdt-formatter.jar > jdt-formatter.jar.sha256
          cat jdt-formatter.jar.sha256
          echo "value=$(awk '{print $1}' jdt-formatter.jar.sha256)" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the JAR
        # Confirm the built artifact is functional before publishing.
        # The downloaded artifact in consumers will be byte-identical.
        run: |
          mkdir -p /tmp/smoke
          printf '%s\n' 'public class Foo {public  void  m( ){if(x==null)return;}}' \
            > /tmp/smoke/Foo.java
          java -jar tooling/jdt-formatter/target/jdt-formatter.jar \
               tooling/ide/java-formatter.xml /tmp/smoke/Foo.java
          grep -q "public class Foo" /tmp/smoke/Foo.java

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
          SHA: ${{ steps.sha.outputs.value }}
        run: |
          # If a release already exists for this tag (e.g. an earlier
          # run created the release but failed before asset upload),
          # upload assets to it; otherwise create a new release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; uploading assets."
            gh release upload "$TAG" \
              tooling/jdt-formatter/target/jdt-formatter.jar \
              tooling/jdt-formatter/target/jdt-formatter.jar.sha256 \
              --clobber
          else
            notes_file=$(mktemp)
            cat > "$notes_file" <<EOF
          JDT formatter JAR for senzing-garage/java-coding-standards $TAG.

          SHA-256: \`$SHA\`

          The JAR is downloaded by \`format_file.py\` on first use and cached
          locally. See CHANGELOG.md for the version's release notes.
          EOF
            gh release create "$TAG" \
              tooling/jdt-formatter/target/jdt-formatter.jar \
              tooling/jdt-formatter/target/jdt-formatter.jar.sha256 \
              --title "$TAG" \
              --notes-file "$notes_file"
            rm -f "$notes_file"
          fi
